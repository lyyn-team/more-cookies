<style>
/* ===== TOKENS =====  CORE = recognizable, WORLD = alive */
:root{
  --navy:#222A3F; --yellow:#F0D32F; --paper:#FFFDF8; --ink:#111111; --gray:#7B7B7B;
  --cookie:#E8C9A5; --cocoa:#70432F; --mint:#9EF9F0; --cherry:#FF5B62; --orange:#FF8A3D;
  --bg:var(--paper); --fg:var(--ink); --head:var(--navy); --mut:#5A564E; --hair:#E2DACB; --soft:#F4EEDF; --focus:var(--navy);
  --ff-d:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --ff-b:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r1:6px; --r2:10px; --r3:16px;
  --t-micro:130ms; --t-std:220ms; --t-scene:380ms; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15131A;--fg:#F5F0E4;--head:#F5F0E4;--mut:#B9B3A4;--hair:#38343F;--soft:#201D27;--focus:#fff}}
:root[data-theme="dark"]{--bg:#15131A;--fg:#F5F0E4;--head:#F5F0E4;--mut:#B9B3A4;--hair:#38343F;--soft:#201D27;--focus:#fff}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff-b);font-size:17px;line-height:1.5;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block} a{color:inherit} h1,h2,h3,h4,p,figure{margin:0} button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 6px var(--yellow);border-radius:4px}
.skip{position:absolute;left:8px;top:-60px;background:var(--yellow);color:var(--navy);padding:12px 16px;font-weight:800;z-index:100;border-radius:var(--r2)}.skip:focus{top:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:clamp(16px,4vw,48px)}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px}
.g>*{min-width:0}
.s-3{grid-column:span 3}.s-4{grid-column:span 4}.s-5{grid-column:span 5}.s-6{grid-column:span 6}.s-7{grid-column:span 7}.s-8{grid-column:span 8}.s-12{grid-column:1/-1}
@media(max-width:900px){.g{grid-template-columns:repeat(8,minmax(0,1fr));gap:20px}[class*="s-"]{grid-column:1/-1}}
@media(max-width:600px){.g{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}

/* ===== SCENES (color follows emotion, not a template) ===== */
.scene{position:relative;padding-block:clamp(64px,10vw,128px);overflow:hidden}
.sc-paper{background:var(--bg)}
.sc-yellow{background:var(--yellow);color:var(--ink);--head:var(--navy);--focus:var(--navy)}
.sc-cocoa{background:var(--cocoa);color:var(--paper);--head:var(--cookie);--mut:#E8D3BC;--focus:#fff}
.sc-orange{background:var(--orange);color:var(--ink);--head:var(--ink);--mut:#2B1A0C;--focus:var(--ink)}
.sc-navy{background:var(--navy);color:var(--paper);--head:var(--yellow);--mut:#C3C8D8;--focus:#fff}
.sc-mint{background:var(--mint);color:var(--ink);--head:var(--navy);--focus:var(--navy)}
.sc-world{background:var(--wbg);color:var(--wfg);--head:var(--whead);--mut:var(--wfg);--focus:var(--wfg);transition:background var(--t-scene) var(--ease),color var(--t-scene)}

/* ===== TYPE: type is narrative ===== */
.d{font-family:var(--ff-d);font-weight:800;text-transform:uppercase;line-height:.86;letter-spacing:.004em;color:var(--head)}
.d-hero{font-size:clamp(80px,14vw,200px)}
.hero__t h1.d{line-height:.93}
.d-xl{font-size:clamp(64px,13vw,190px)}
.d-l{font-size:clamp(48px,8vw,104px)}
.d-m{font-size:clamp(36px,5vw,64px);line-height:.92}
.small{font-size:14px;line-height:1.4}
.mut{color:var(--mut)}
.lead{font-size:clamp(18px,2.2vw,22px);line-height:1.4}
.label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.tbd{} body.review .tbd{outline:1.5px dashed #B89B00;outline-offset:2px;background:rgba(240,211,47,.3);border-radius:3px}

/* ===== BUTTONS (physical, fast) ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 28px;border-radius:var(--r2);border:2px solid transparent;font-weight:800;font-size:15px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform var(--t-micro) var(--ease),background var(--t-micro),color var(--t-micro),box-shadow var(--t-micro)}
.btn:active{transform:scale(.97) translateY(1px)}
.btn--y{background:var(--yellow);color:var(--navy)} .btn--y:hover{background:#F7E05A}
.btn--n{background:var(--navy);color:#fff} .btn--n:hover{background:#2E3852}
.btn--o{background:transparent;border-color:currentColor;color:var(--head)} .btn--o:hover{background:var(--head);color:var(--bg)}
.sc-orange .btn--o:hover,.sc-yellow .btn--o:hover,.sc-mint .btn--o:hover{color:var(--paper)}
.btn--sm{min-height:44px;padding:0 18px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.is-ok{background:var(--navy);color:var(--yellow)}
.btn.is-loading{pointer-events:none}.btn.is-loading::before{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;background:transparent;border:0;border-radius:50%;cursor:pointer;position:relative;color:var(--head)}
.ib:hover{background:var(--soft)} .ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;right:0;min-width:20px;height:20px;border-radius:999px;background:var(--yellow);color:var(--navy);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}.badge[hidden]{display:none}
.bump{animation:bump var(--t-std) var(--ease)}@keyframes bump{40%{transform:scale(1.25)}}

/* ===== HEADER ===== */
.hdr{position:sticky;top:0;z-index:30;background:var(--bg)}
.hdr__in{display:flex;align-items:center;gap:32px;height:76px}
.logo{height:48px;width:auto;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{background:var(--paper);padding:3px 5px;border-radius:var(--r1)}}
.nav{display:flex;gap:28px;margin-left:auto;align-items:center}
.nav a,.nav button{font:800 14px var(--ff-b);letter-spacing:.09em;text-transform:uppercase;text-decoration:none;padding:12px 2px;border:0;background:none;cursor:pointer;color:var(--head);border-bottom:3px solid transparent}
.nav a:hover,.nav button:hover,.nav a[aria-current="page"]{border-bottom-color:var(--yellow)}
.hdr__act{display:flex;align-items:center;gap:8px}
.hdr__back{min-height:44px;flex:0 0 auto;white-space:nowrap;gap:6px}
.only-m{display:none}
@media(max-width:900px){.nav{display:none}.only-m{display:inline-grid}.hdr__act{margin-left:auto}.hdr__in{height:64px;gap:12px}.logo{height:42px}}

/* ===== DIALOGS ===== */
dialog{border:0;padding:0;color:var(--fg);background:var(--bg)}
dialog::backdrop{background:rgba(17,17,17,.55)}
dialog.side{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(460px,100%);animation:slidein var(--t-std) var(--ease)}
dialog.modal{width:min(680px,calc(100% - 32px));max-height:min(88dvh,820px);margin:auto;border-radius:var(--r3);animation:rise var(--t-std) var(--ease)}
dialog.modal[open]{display:flex;flex-direction:column;overflow:hidden}
dialog.modal .dlg{flex:1 1 auto;height:auto;min-height:0}
dialog.side[open]{overflow:hidden}
dialog{overscroll-behavior:contain}
.dlg-open{overflow:hidden;padding-right:var(--sbw,0px)}
dialog.menu{margin:0;width:100%;max-width:none;height:100dvh;max-height:none;background:var(--yellow);color:var(--navy);--focus:var(--navy)}
@media(max-width:600px){dialog.side,dialog.modal{width:100%;max-width:none;height:100dvh;max-height:none;margin:0;border-radius:0}}
@keyframes slidein{from{transform:translateX(36px);opacity:0}}@keyframes rise{from{transform:translateY(14px);opacity:0}}
.dlg{display:flex;flex-direction:column;height:100%;min-height:0}
.dlg__h{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 12px 24px}
.dlg__b{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 24px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dlg__b:focus-visible{outline:3px solid var(--focus,var(--navy));outline-offset:-3px}
.dlg__f{padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair);display:grid;gap:12px}
.menu nav{display:grid;padding:16px 24px;overflow:auto}
.menu nav a{font-family:var(--ff-d);font-weight:800;text-transform:uppercase;font-size:clamp(52px,12vw,96px);line-height:.98;text-decoration:none;color:var(--navy);padding:2px 0;transition:transform var(--t-micro) var(--ease)}
.menu nav a:hover{transform:translateX(10px)}
.menu nav a.sm{font-size:clamp(28px,6vw,40px)}
.field{display:grid;gap:6px}.field label{font-weight:800;font-size:13px}
.inp{min-height:48px;border:2px solid var(--fg);background:var(--bg);border-radius:var(--r2);padding:0 14px;width:100%}

/* ===== ASSET SLOTS: unmistakable room for real photography, quiet until filled ===== */
.slot{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:14px;overflow:hidden;width:100%;aspect-ratio:var(--ar,4/5);background:var(--sw,var(--cookie));color:var(--ink)}
.slot.fill{height:100%;aspect-ratio:auto;position:absolute;inset:0}
.slot__tag{position:absolute;top:12px;left:12px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.slot__t{font-size:12px;line-height:1.3;max-width:30ch;opacity:.75}
img.asset{width:100%;height:auto;aspect-ratio:var(--ar,4/5);object-fit:cover}
.slot[data-w="cocoa"]{--sw:#8A5640;color:var(--paper)}.slot[data-w="yellow"]{--sw:var(--yellow)}.slot[data-w="mint"]{--sw:var(--mint)}.slot[data-w="cherry"]{--sw:var(--cherry)}.slot[data-w="orange"]{--sw:#FFA566}.slot[data-w="navy"]{--sw:#3A435C;color:var(--paper)}.slot[data-w="paper"]{--sw:#EFE7D6}
.sh-circle{border-radius:50%}.sh-arch{border-radius:999px 999px 0 0}.sh-round{border-radius:var(--r3)}.sh-tilt{transform:rotate(-2.5deg)}.sh-tilt2{transform:rotate(2deg)}
.sh-bite{border-radius:50%;-webkit-mask-image:radial-gradient(circle at 86% 16%,#0000 0 8%,#000 8.4%),radial-gradient(circle at 97% 33%,#0000 0 5.5%,#000 5.9%),radial-gradient(circle at 70% 5%,#0000 0 5%,#000 5.4%);-webkit-mask-composite:source-in;mask-image:radial-gradient(circle at 86% 16%,#0000 0 8%,#000 8.4%),radial-gradient(circle at 97% 33%,#0000 0 5.5%,#000 5.9%),radial-gradient(circle at 70% 5%,#0000 0 5%,#000 5.4%);mask-composite:intersect}
.slot.sh-circle,.slot.sh-bite{aspect-ratio:1;align-items:center;justify-content:center;text-align:center}.slot.sh-circle .slot__tag,.slot.sh-bite .slot__tag{left:50%;transform:translateX(-50%);top:18%}

/* ===== THE REVEAL (signature): break the cookie ===== */
.reveal{position:relative;--p:100;overflow:hidden;aspect-ratio:var(--ar,1);background:var(--cookie);touch-action:pan-y;user-select:none}
.reveal__a,.reveal__b{position:absolute;inset:0}.reveal__b{clip-path:inset(0 0 0 100%)}.reveal__z{position:absolute;inset:0;overflow:hidden}.reveal__z>*{transform:scale(1.8);transform-origin:var(--zo,50% 50%)}
.reveal__h{position:absolute;top:0;bottom:0;left:calc(var(--p) * 1%);width:0;pointer-events:none}
.reveal__h::before{content:"";position:absolute;left:-1.5px;top:0;bottom:0;width:3px;background:var(--paper)}
.reveal__h span{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:20px;transition:transform var(--t-micro) var(--ease)}
.reveal:active .reveal__h span{transform:translate(-50%,-50%) scale(.9)}
.reveal .slot__t{display:none}.reveal .slot__tag{top:auto;bottom:14%}
.reveal input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.reveal input::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:100vh}.reveal input::-moz-range-thumb{width:52px;height:100vh;border:0;background:transparent}
.reveal:has(input:focus-visible){box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--navy)}
.hint{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-top:12px;color:var(--head)}

/* ===== HERO: the door ===== */
.hero{padding-block:clamp(16px,3vw,40px) clamp(56px,8vw,112px)}
.hero__g{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:center;gap:0 24px}
.hero__t{position:relative;z-index:2;grid-column:1;grid-row:1}
.hero__t h1{display:grid;margin-left:-.04em}
.hero__t .mark{background:var(--yellow);color:var(--navy);padding:0 .12em;margin-left:-.06em;width:max-content;transform:rotate(-1.5deg);display:inline-block}
.hero__sub{font-size:clamp(20px,2.4vw,26px);line-height:1.25;margin-top:28px;max-width:20ch;font-weight:600}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero__v{grid-column:2;grid-row:1;position:relative;z-index:1;margin-left:-6%}
.hero__v .bitewrap{position:relative}
@media(max-width:900px){
  .hero__g{grid-template-columns:1fr}
  .hero__v{grid-column:1;grid-row:1;margin:0 -4px 0 12%}
  .hero__t{grid-row:2;margin-top:-14vw}
  .hero__t h1{font-size:clamp(80px,26vw,200px)}
}

/* ===== TICKER: moments, felt not told ===== */
.ticker{background:var(--yellow);color:var(--navy);overflow:hidden;white-space:nowrap;border-block:3px solid var(--navy)}
.ticker__in{display:inline-flex;animation:tick 34s linear infinite;padding-block:12px}
.ticker:hover .ticker__in{animation-play-state:paused}
.ticker span{font-family:var(--ff-d);font-weight:800;text-transform:uppercase;font-size:clamp(26px,3.4vw,40px);line-height:1;display:inline-flex;align-items:center;gap:28px;padding-right:28px}
.ticker i{width:14px;height:14px;border-radius:50%;background:var(--navy);display:inline-block;flex:none}
@keyframes tick{to{transform:translateX(-50%)}}

/* ===== SCENE 02: abre a caixa ===== */
.box__g{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:48px;align-items:center}
.box__steps{display:grid;gap:4px;margin:32px 0}
.box__steps p{font-family:var(--ff-d);font-weight:700;font-size:clamp(34px,5vw,60px);line-height:1;color:var(--paper)}
.box__steps p:nth-child(2){margin-left:.8em}.box__steps p:nth-child(3){margin-left:1.6em;color:var(--yellow)}
.box__pic{position:relative}
.box__pic .small-pic{position:absolute;width:38%;left:-8%;bottom:-8%}
@media(max-width:900px){.box__g{grid-template-columns:1fr;gap:40px}.box__pic{margin-inline:6%}}

/* ===== SCENE 03: vai de qual ===== */
.top3{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start;margin-top:56px}
.top3>article:nth-child(1){grid-column:1/6}
.top3>article:nth-child(2){grid-column:6/9;margin-top:96px}
.top3>article:nth-child(3){grid-column:9/13;margin-top:32px}
@media(max-width:900px){.top3{grid-template-columns:1fr;gap:56px}.top3>article:nth-child(n){grid-column:1;margin-top:0}.top3>article:nth-child(2){margin-inline:14%}}
.pm{display:grid;gap:12px;position:relative}
.pm__pic,.pm__pic *{text-decoration:none}.pm__pic{display:block;transition:transform var(--t-std) var(--ease)}
.pm:hover .pm__pic{transform:rotate(-1.5deg) scale(1.015)}
.pm h3{font-family:var(--ff-d);font-weight:800;text-transform:uppercase;font-size:clamp(40px,5vw,64px);line-height:.9;color:var(--head)}
.pm h3 a{text-decoration:none}.pm h3 a::after{content:"";position:absolute;inset:0 0 64px}
.pm__m{font-size:18px;font-weight:600}
.pm .btn{justify-self:start;position:relative;z-index:2}
.pm--v h3 a::after{display:none}.vslot[data-w="paper"]{--sw:#EFE7D6}
.rows{margin-top:72px;border-top:3px solid var(--navy)}
.row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,5fr) 44px;gap:16px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--hair);position:relative;transition:background var(--t-micro),transform var(--t-micro) var(--ease)}
.row:hover{background:var(--yellow);transform:translateX(8px);color:var(--navy)}
.row__n{font-family:var(--ff-d);font-weight:800;text-transform:uppercase;font-size:clamp(30px,4.4vw,56px);line-height:1;text-decoration:none;color:inherit}
.row__n::after{content:"";position:absolute;inset:0 56px 0 0}
.row__m{font-weight:600;font-size:16px}
.row .ib{position:relative;z-index:2;border:2px solid currentColor;color:inherit;font-size:22px;font-weight:800}
.row .ib:hover{background:var(--navy);color:#fff}
@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr) 44px;row-gap:0}.row__m{grid-column:1;grid-row:2;font-size:14px}.row .ib{grid-column:2;grid-row:1/3}.row:hover{transform:none}}

/* ===== SCENE 04: o momento (world shifts with mood) ===== */
.mom__g{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;align-items:start}
.mom__hint{margin:0 0 24px;font-size:17px;font-weight:600;opacity:.7}
.mom__list{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 16px;container-type:inline-size}
.mom__list .mom__btn:nth-child(-n+3){grid-column:span 2}.mom__list .mom__btn:nth-child(n+4){grid-column:span 3}
.mom__btn{display:flex;align-items:flex-end;min-height:clamp(88px,9vw,124px);font-family:var(--ff-d);font-weight:800;text-transform:uppercase;font-size:clamp(34px,4.6cqw,60px);line-height:.95;text-align:left;text-wrap:balance;overflow-wrap:break-word;padding:14px 18px 16px;border:0;border-top:3px solid var(--wfg);background:transparent;cursor:pointer;color:inherit;border-radius:0;transition:transform var(--t-micro) var(--ease),background var(--t-micro),color var(--t-micro)}
.mom__btn:hover{background:color-mix(in srgb,var(--wfg) 10%,transparent);transform:translateY(-2px)}.mom__btn:active{transform:translateY(0) scale(.99)}.mom__btn:focus-visible{outline:3px solid var(--wfg);outline-offset:3px}.mom__btn[aria-pressed="true"]:hover{background:var(--wfg)}
.mom__btn[aria-pressed="true"]{background:var(--wfg);color:var(--wbg)}
.mom__out{display:grid;gap:28px;padding-top:32px;border-top:3px solid var(--wfg)}.mom__out[hidden]{display:none}
.mom__intro{display:grid;gap:16px;align-content:start;min-width:0}
.mom__out h3{color:var(--head);font-family:var(--ff-d);font-weight:800;text-transform:uppercase;font-size:clamp(46px,6.4vw,84px);line-height:.9;overflow-wrap:break-word}
.mom__items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:20px;min-width:0}
.mi{display:flex;flex-direction:column;gap:14px;padding:18px;min-width:0;border:2px solid color-mix(in srgb,var(--wfg) 28%,transparent);border-radius:var(--r2);background:color-mix(in srgb,var(--wfg) 7%,transparent);animation:rise var(--t-std) var(--ease) both}
.mi__pic{width:min(100%,200px)}.mi__txt{flex:1;min-width:0}.mi .btn{align-self:flex-start;max-width:100%}

function Cookies(q){

  <div class="chips" role="group" aria-label="Categoria"><button class="chip" data-act="cat" data-c="all" aria-pressed="${F.cat==='all'}">Todos</button>${CATEGORIES.filter(c=>c.id!=='bestseller'||PRODUCTS.some(p=>p.bestseller)).map(c=>`<button class="chip" data-act="cat" data-c="${c.id}" aria-pressed="${F.cat===c.id}">${c.label}</button>`).join('')}</div></div>
  <p class="vh" id="cnt" aria-live="polite"></p><div id="plist"></div></div></section>`;

function paintList(){
  const l=$('#plist');if(!l)return;
  const c=CATEGORIES.find(x=>x.id===F.cat),t=F.q.trim().toLowerCase();
  const r=PRODUCTS.filter(p=>(!c||c.test(p))&&(!t||p.name.toLowerCase().includes(t)||p.sensoryDescription.toLowerCase().includes(t)||p.moment.toLowerCase().includes(t)));
  l.innerHTML=r.length?`<div class="pgrid">${r.map(ProductTile).join('')}</div>`:EmptyState('A gente não encontrou isso.','Mas outros cookies existem.',`<button class="btn btn--o btn--sm" data-act="clear">Ver todos</button>`);
  $('#cnt').textContent=`${r.length} ${r.length===1?'cookie':'cookies'}`;
  $$('[data-act="cat"]').forEach(b=>b.setAttribute('aria-pressed',F.cat===b.dataset.c));
}
function Product(slug){

  return `<div class="wrap" style="padding-top:24px"><p class="crumb"><a href="#/cookies">Cookies</a> / ${esc(p.name)}</p>
  <div class="g" style="align-items:start"><div class="s-6">${Reveal(p,{shape:'round',ar:(p.images[0]&&p.images[0].ar)||'1',hero:true})}</div>
  <div class="s-6" style="display:grid;gap:24px;align-content:start">
    <div>${p.bestseller?'<span class="tag">Mais pedido</span>':''}<h1 class="d d-l" style="margin-top:12px;overflow-wrap:anywhere">${esc(p.name)}</h1></div>
    <p class="lead">${tbd(esc(p.sensoryDescription))}</p>
    <p class="d d-m"><span style="background:var(--yellow);color:var(--navy);padding:0 .15em">${esc(p.moment)}</span></p>
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${money(p)?`<span class="d d-m">${money(p)}</span>`:''}<button class="btn btn--y" data-act="add" data-id="${p.id}">Quero esse</button></div>
    <div>${p.ingredients?`<details><summary>O que tem dentro</summary><p class="mut">${esc(p.ingredients)}</p></details>`:''}<details><summary>Alérgenos</summary><p class="mut">${p.allergens?esc(p.allergens)+' ':''}Alergia? Fala com a loja antes de pedir. <a href="#/ajuda">Como falar com a gente</a></p>${store().whatsapp?`<p style="margin-top:12px">${waBtn(store().whatsapp,WA.allergen(p),'Perguntar à '+esc(store().name)+' no WhatsApp')}</p>`:''}</details><details><summary>Onde tem</summary><p class="mut">Confirma na loja se esse está por lá. <a href="#/lojas">Achar uma loja</a></p></details></div>
  </div></div>
  ${rel.length?`<section style="padding-block:96px 64px"><h2 class="d d-l" style="margin-bottom:32px">Do mesmo clima</h2><div style="border-top:3px solid var(--navy)">${rel.map(ProductRow).join('')}</div></section>`:''}</div>
  <div class="pdp-bar"><button class="btn btn--y" style="flex:1" data-act="add" data-id="${p.id}">Quero esse</button></div>`;
}
const fmtD=d=>d?new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long'}):'';
function NewsItem(c){const sts=(c.stores||[]).map(id=>STORES.find(x=>x.id===id)).filter(Boolean),pr=c.productId&&byId(c.productId),when=c.startDate||c.endDate?[fmtD(c.startDate)&&'De '+fmtD(c.startDate),fmtD(c.endDate)&&'até '+fmtD(c.endDate)].filter(Boolean).join(' '):'';
  const cta=c.cta?`<a class="btn btn--n" href="${esc(c.cta.href)}">${esc(c.cta.label)}</a>`:pr?`<a class="btn btn--n" href="#/cookies/${pr.slug}">Conhecer</a>`:'';

function Novidades(){const l=CAMPAIGNS.filter(c=>c.status==='live');return `<section class="scene sc-mint" style="padding-top:clamp(32px,5vw,64px)"><div class="wrap"><h1 class="d d-xl">Chegou.</h1>${l.length?l.map(NewsItem).join(''):EmptyState('Nada novo por enquanto.','Quando chegar, chega aqui primeiro.','<a class="btn btn--n btn--sm" href="#/cookies">Ver os cookies</a>')}</div></section>`}
function Lojas(){const cs=[...new Set(STORES.map(x=>x.city))];return `<section class="scene sc-paper" style="padding-top:clamp(32px,5vw,64px)"><div class="wrap"><h1 class="d d-xl">Vai lá.</h1>${cs.map(c=>`<h2 class="d d-m" style="margin:56px 0 24px">${esc(c)}</h2><div class="pgrid">${STORES.filter(x=>x.city===c).map(StoreCard).join('')}</div>`).join('')}</div></section>`}

  <section aria-labelledby="pedir"><h2 id="pedir" class="d d-m" style="margin-bottom:12px">Pedir</h2>${r.length||s.whatsapp?ChannelBlock(s,{items:cartItems(),fulfil:S.fulfil}):'<p class="mut">Em breve, o jeito de pedir desta loja.</p>'}${s.whatsapp?`<div class="chips" style="margin-top:16px">${waBtn(s.whatsapp,WA.store(s),'Falar com a loja')}${waBtn(s.whatsapp,WA.delivery(s),'Dúvida sobre entrega')}</div>`:''}</section>
  ${sv.length?`<section aria-labelledby="serv"><h2 id="serv" class="d d-m" style="margin-bottom:12px">Na loja</h2><div class="chips">${sv.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></section>`:''}

  <p style="padding-block:72px 64px"><a class="btn btn--o" href="#/cookies">Ver os cookies</a></p></div>`}
